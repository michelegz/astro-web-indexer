server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # The php container is recreated by every build and comes back with a
    # different address. nginx resolves an upstream NAME once, when it reads the
    # configuration, and keeps that address until it is reloaded: with a plain
    # `fastcgi_pass php:9000` the server goes on talking to the container that no
    # longer exists and answers 502 - a build that succeeded and a site that is
    # dead, with nothing in the build output to explain it.
    #
    # With a variable the name is resolved per request, through Docker's embedded
    # DNS, and the answer is cached for $resolver_valid: a recreated container is
    # picked up on its own, with no reload and no restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Security headers
    # Prevents the page from being embedded in iframes on other origins (anti-phishing/clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevents MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Controls how much referrer info is sent
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restricts access to browser features not needed by this app
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # Content Security Policy: restricts resource loading to the same origin.
    # 'unsafe-inline' is required for Tailwind's generated styles and inline event handlers.
    # blob: is required for ZIP download generation in the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src blob:; frame-ancestors 'self';" always;
    # Tell crawlers and Safe Browsing scanners not to index this private app
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /fits/ {
        auth_request /auth_check;
        alias /var/fits/;
        autoindex on;
    }

    # Internal endpoint for auth_request subrequests
    location = /auth_check {
        internal;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/auth_check.php;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param CONTENT_TYPE "";
        fastcgi_pass_request_body off;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Special location for the download script with a longer timeout
    location = /download.php {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Increase the timeout specifically for zip file generation
        fastcgi_read_timeout 3600;

        # Disable buffering for streaming ZIP downloads
        fastcgi_buffering off;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
    }
}
