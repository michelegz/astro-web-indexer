; Custom PHP limits for Astro Web Indexer

; Increase memory limit for large file operations (e.g., zip creation).
; Default is often 128M.
memory_limit = 512M

; Increase default max execution time.
; This is a general limit; specific scripts can override it.
; Default is often 30s.
max_execution_time = 60

; Bulk project actions submit one checkbox per file (suggestion_ids[],
; link_keys[]). With >1000 files the PHP default (1000) truncates $_POST
; with "Input variables exceeded 1000" and breaks the request. The forms
; now pack the selection into a single CSV field, but keep a higher limit
; as a safety net for no-JS fallback and other bulk forms.
max_input_vars = 10000
